[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "rewear-studio"
version = "1.0.0"
description = "A local, reviewable garment catalogue with Glimmer, Spark and SAM"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "python-multipart>=0.0.20,<1",
  "httpx>=0.28,<1",
  "pydantic>=2.10,<3",
  "openai>=1.70,<4",
  "Pillow>=11,<13",
  "meta-sam-parser==0.1.0",
  "requests>=2.32,<3",
  "numpy>=2,<3",
  "argon2-cffi>=23.1,<26",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.11,<1", "playwright==1.62.0"]
image-search = ["google-auth>=2,<3"]

[project.scripts]
rewear = "wardrobe.__main__:main"

[tool.setuptools.packages.find]
include = ["wardrobe*"]

[tool.setuptools.package-data]
wardrobe = ["garment_schema.json", "static/*", "static/assets/*", "demo/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
